[features]
multi_agent = true

[agents]
max_threads = 3
max_depth = 1
job_max_runtime_seconds = 1200

[desktop]
git-commit-instructions = '''- 按照 gitmoji 规范 + 约定式提交（Conventional Commits）规范
- 例如：`✨ feat(extensions): 添加 git 提交命令`
- 主题开头选择合适的 emoji
- type 选择合适的类型（feat/fix/docs/style/refactor/perf/test/build/ci/chore/revert）
- scope 使用受影响的模块或功能名，不明确可省略
- description 用中文说明"为什么"做这个改动
- 主题行长度控制在 72 个字符以内'''
